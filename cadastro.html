<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próxima Passada — Cadastro de necessidade</title>
<style>
  :root{
    --ink:#173049;
    --ink-soft:#4a5c6b;
    --paper:#eef1f2;
    --card:#ffffff;
    --line:#dde3e6;
    --accent:#f0592a;
    --accent-deep:#d0431a;
    --accent-soft:#fdece5;
    --teal:#159199;
    --teal-soft:#e2f2f3;
    --radius:14px;
    --shadow:0 1px 3px rgba(23,48,73,.06),0 10px 28px rgba(23,48,73,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    padding:0 0 4rem;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 20px}

  header{padding:2rem 0 .5rem;text-align:center}
  .logo-block{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:1.6rem 1.5rem;margin-top:0;text-align:center;
  }
  .logo-block img{width:230px;max-width:75%;height:auto;display:block;margin:0 auto}
  .logo-block p{margin-top:1rem;color:var(--ink-soft);font-size:1.02rem}

  .block{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:1.5rem 1.5rem;margin-top:1.2rem;
  }
  .block-title{
    display:flex;align-items:center;gap:.55rem;
    font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--teal);margin-bottom:1.2rem;
  }
  .block-title .n{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;
    font-size:.78rem;font-weight:700;flex:0 0 auto;
  }

  .field{margin-bottom:1.15rem}
  .field:last-child{margin-bottom:0}
  label{display:block;font-weight:600;font-size:.94rem;margin-bottom:.4rem}
  input[type=text],select,textarea{
    width:100%;font:inherit;font-size:1rem;color:var(--ink);
    background:#fbfcfc;border:1px solid var(--line);border-radius:9px;
    padding:.65rem .75rem;transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(240,89,42,.14);
  }
  select:disabled{background:#f0f2f3;color:#9aa7ae;cursor:not-allowed}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:.8rem}
  .row .field{flex:1}

  .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.15rem}
  .chip{
    position:relative;cursor:pointer;user-select:none;
    font-size:.9rem;padding:.45rem .85rem;border-radius:99px;
    background:#fbfcfc;border:1px solid var(--line);transition:all .13s;
  }
  .chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:600}
  .seg{display:flex;gap:.5rem;flex-wrap:wrap}
  .seg .chip{flex:0 0 auto}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    width:100%;font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;
    background:var(--accent);color:#fff;border:none;border-radius:11px;
    padding:.9rem 1rem;margin-top:1.2rem;transition:background .15s,transform .05s;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:transparent;color:var(--accent-deep);border:1px solid var(--line);margin-top:.7rem}
  .btn.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}

  .out{display:none;margin-top:1.2rem}
  .out.show{display:block;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .out h2{font-size:1.05rem;margin-bottom:.2rem}
  .out .sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:1rem}

  .confirm{text-align:center;padding:2.4rem 1.6rem 2rem}
  .confirm-mark{
    width:64px;height:64px;margin:0 auto 1.1rem;border-radius:50%;
    background:var(--teal-soft);color:var(--teal);
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;font-weight:700;line-height:1;
  }
  .confirm h2{font-size:1.35rem;color:var(--ink);margin-bottom:.7rem}
  .confirm-linha{color:var(--ink-soft);font-size:1rem;margin-bottom:.35rem}
  .confirm-linha:empty{display:none}
  .confirm .btn.ghost{margin-top:1.4rem}

  .sheet-status{font-size:.86rem;margin:.9rem 0 .2rem;min-height:1.1em}
  .sheet-status.sending{color:var(--ink-soft)}
  .sheet-status.ok{color:#0d6a70;font-weight:600}
  .sheet-status.fail{color:var(--accent-deep)}
  footer{text-align:center;margin-top:2rem;font-size:.8rem;color:var(--ink-soft)}
  .err{color:var(--accent-deep);font-size:.86rem;margin-top:.6rem;display:none;text-align:center}
  .err.show{display:block}
</style>
</head>

        <label>Tipo de tênis</label>
        <div class="seg" id="tipo">
          <label class="chip"><input type="radio" name="tipo" value="Masculino">Masculino</label>
          <label class="chip"><input type="radio" name="tipo" value="Feminino">Feminino</label>
        </div>
      </div>

      <div class="field">
        <label for="genero">Perfil</label>
        <select id="genero">
          <option value="">Selecione</option>
          <option>Infantil</option>
          <option>Juvenil</option>
          <option>Adulto</option>
        </select>
      </div>

      <div class="field">
        <label for="obs">Observação (opcional)</label>
        <textarea id="obs" placeholder="Ex.: prefere cores neutras; usa órtese; tem pisada pronada."></textarea>
      </div>
    </div>

    <div class="block">
      <div class="block-title"><span class="n">3</span> Identificação do treinador</div>

      <div class="field">
        <label for="treinador">Seu nome</label>
        <input type="text" id="treinador" placeholder="Nome do treinador ou educador">
      </div>

      <div class="row">
        <div class="field">
          <label for="trtel">Telefone</label>
          <input type="text" id="trtel" inputmode="tel" placeholder="(11) 90000-0000">
        </div>
        <div class="field">
          <label for="tremail">E-mail</label>
          <input type="text" id="tremail" inputmode="email" placeholder="nome@exemplo.com">
        </div>
      </div>
    </div>

    <button type="submit" class="btn">Enviar</button>
    <p class="err" id="err">Preencha ao menos o nome do atleta, o tamanho e o local.</p>
  </form>

  <section class="out" id="out">
    <div class="block confirm">
      <div class="confirm-mark">✓</div>
      <h2>Cadastro concluído</h2>
      <p class="confirm-linha" id="confAtleta"></p>
      <p class="confirm-linha" id="confTreinador"></p>
      <p class="sheet-status" id="sheetStatus"></p>
      <button class="btn ghost" id="new">+ Cadastrar outro atleta</button>
    </div>
  </section>

  <footer>
  <p style="margin-bottom:.5rem"><a href="index.html" id="voltar-site" style="color:var(--teal);text-decoration:none;font-weight:600">← Página do projeto</a></p>
  Próxima Passada · cada tênis parado pode virar a próxima passada de alguém.</footer>
</div>

<script>
  var LOCAIS={
    "Achilles International Brazil":["Parque do Ibirapuera","Parque Villa-Lobos","USP - Raia Olímpica","Parque do Povo"],
    "Projeto Impulso":["Sede Projeto Impulso","Parque do Carmo","CEU - quadra parceira"]
  };

  var ongSel=document.getElementById('ong');
  var localSel=document.getElementById('local');
  ongSel.addEventListener('change',function(){
    var ong=ongSel.value;
    localSel.innerHTML='';
    if(!ong || !LOCAIS[ong]){
      localSel.innerHTML='<option value="">Selecione a ONG primeiro</option>';
      localSel.disabled=true;return;
    }
    localSel.disabled=false;
    var opt=document.createElement('option');opt.value='';opt.textContent='Selecione';localSel.appendChild(opt);
    LOCAIS[ong].forEach(function(l){
      var o=document.createElement('option');o.value=l;o.textContent=l;localSel.appendChild(o);
    });
  });

  var sizeWrap=document.getElementById('sizes');
  for(var s=28;s<=44;s++){
    var l=document.createElement('label');
    l.className='chip';
    l.innerHTML='<input type="radio" name="size" value="'+s+'">'+s;
    sizeWrap.appendChild(l);
  }
  function paintChips(wrap){
    [].forEach.call(wrap.querySelectorAll('.chip'),function(c){
      c.classList.toggle('on',c.querySelector('input').checked);
    });
  }
  sizeWrap.addEventListener('change',function(){paintChips(sizeWrap);});
  var tipoWrap=document.getElementById('tipo');
  tipoWrap.addEventListener('change',function(){paintChips(tipoWrap);});

  // ▼▼▼ COLE AQUI A URL DO SEU APP DA WEB (Apps Script). Deixe vazio para desativar o envio. ▼▼▼
  var SHEETS_URL = "https://script.google.com/macros/s/AKfycbxErwLBCZScYBG32L56IejUZFgun8vsi27MCFDM4NVj9o9I0Tn_TcnUj94nI_KRKlrw/exec";
  // ▲▲▲ Ex.: "https://script.google.com/macros/s/AKfyc.../exec" ▲▲▲

  function val(id){return (document.getElementById(id).value||'').trim();}
  function firstName(full){return full.split(/\s+/)[0]||'';}
  function pick(name){var r=document.querySelector('input[name='+name+']:checked');return r?r.value:'';}

  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var full=val('atleta'), size=pick('size'), local=val('local');
    var err=document.getElementById('err');
    if(!full||!size||!local){err.classList.add('show');return;}
    err.classList.remove('show');

    var first=firstName(full);
    var idade=val('idade'), tipo=pick('tipo'), genero=val('genero'), obs=val('obs');
    var ong=val('ong'), localesp=val('localesp');
    var treinador=val('treinador'), tremail=val('tremail'), trtel=val('trtel');
    var idadeTxt=idade?(/^\d+$/.test(idade)?idade+' anos':idade):'';
    var localFull=local+(localesp?' ('+localesp+')':'');

    var flex=(tipo==='Feminino')?'a':'o';
    document.getElementById('confAtleta').textContent=
      first+(idadeTxt?', '+idadeTxt+',':'')+' foi cadastrad'+flex+
      ' — tamanho '+size+' (BR), '+localFull+'.';
    document.getElementById('confTreinador').textContent=
      treinador ? 'Treinador responsável: '+treinador+'.' : '';

    document.getElementById('form').style.display='none';
    var out=document.getElementById('out');
    out.classList.add('show');
    window.scrollTo({top:0,behavior:'smooth'});

    // Envio para a planilha (Google Sheets via Apps Script), se a URL estiver configurada.
    if(SHEETS_URL){
      var status=document.getElementById('sheetStatus');
      if(status){status.textContent='Enviando para a planilha…';status.className='sheet-status sending';}
      var payload={
        ong:ong, local:local, localesp:localesp,
        atleta:full, idade:idade, tamanho:size, tipo:tipo, perfil:genero,
        obs:obs, treinador:treinador, telefone:trtel, email:tremail
      };
      fetch(SHEETS_URL,{
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(payload)
      }).then(function(){
        if(status){status.textContent='✓ Salvo na planilha';status.className='sheet-status ok';}
      }).catch(function(){
        if(status){status.textContent='Não foi possível salvar na planilha. Verifique a conexão e cadastre novamente.';status.className='sheet-status fail';}
      });
    }
  });

  document.getElementById('new').addEventListener('click',function(){
    var form=document.getElementById('form');
    form.reset();
    localSel.innerHTML='<option value="">Selecione a ONG primeiro</option>';localSel.disabled=true;
    paintChips(sizeWrap);paintChips(tipoWrap);
    var st=document.getElementById('sheetStatus');
    if(st){st.textContent='';st.className='sheet-status';}
    document.getElementById('out').classList.remove('show');
    form.style.display='';
    window.scrollTo({top:0,behavior:'smooth'});
  });
</script>
</body>
</html>
